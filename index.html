<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROJECT BROCOLITO // CLASSIFIED</title>
<style>
:root{--bg:#05080a;--p:#0b1217;--p2:#0e181e;--line:#293a44;--txt:#dce7eb;--mut:#71838e;--ok:#8ee6b2;--warn:#ffc56d;--bad:#ff7272}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#172830,#05080a 55%);color:var(--txt);font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
#app{max-width:1040px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 2px 13px;margin-bottom:12px;font-size:11px;letter-spacing:1px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.progress{height:4px;background:#152129;margin-bottom:12px}.bar{height:100%;background:var(--ok);transition:.7s}
.screen{position:relative;min-height:700px;padding:22px;background:rgba(8,14,18,.96);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 80px #000b;overflow:hidden}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff1 4px);opacity:.08}.content{position:relative;z-index:1}
h1{font-size:clamp(30px,7vw,60px);letter-spacing:5px;margin:0 0 10px}h2{font-size:21px;margin:0 0 8px;letter-spacing:1px}.small{font-size:11px;color:var(--mut)}
.terminal{background:#020405;border:1px solid #1d2a31;border-radius:7px;padding:15px;white-space:pre-wrap;line-height:1.7;margin:15px 0;box-shadow:inset 0 0 35px #000}
button,input{font:inherit}button{background:#0d181e;border:1px solid #41545f;color:var(--txt);padding:11px 14px;border-radius:6px;cursor:pointer}button:hover{border-color:var(--ok);color:var(--ok)}button.primary{background:#123021;border-color:#5c9e79;color:#c5f6d5}button:disabled{opacity:.35;cursor:not-allowed}
.answer{display:flex;gap:8px;margin-top:14px}.answer input{flex:1}input{background:#020405;border:1px solid #41545f;color:var(--txt);border-radius:6px;padding:12px;outline:none}input:focus{border-color:var(--ok)}
.feedback{min-height:44px;margin:13px 0}.hint{border-left:3px solid var(--warn);background:#171208;padding:10px 12px;color:#ead9ba}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#081015;border:1px solid var(--line);padding:14px;border-radius:7px}.card:hover{border-color:#4e6470}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut)}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.options button{min-height:70px}
.dial{width:min(300px,82vw);aspect-ratio:1;border:2px solid #3a5661;border-radius:50%;margin:16px auto;position:relative;background:radial-gradient(circle,#10242b 0 2%,transparent 2% 19%,#203942 19.5% 20%,transparent 20.5% 39%,#203942 39.5% 40%,transparent 40.5% 59%,#203942 59.5% 60%,transparent 60.5% 79%,#203942 79.5% 80%,transparent 80.5%)}.needle{position:absolute;left:50%;bottom:50%;width:3px;height:40%;background:var(--ok);transform-origin:50% 100%;transition:.4s}.hub{position:absolute;left:50%;top:50%;width:13px;height:13px;background:var(--ok);border-radius:50%;transform:translate(-50%,-50%)}
.radar{width:min(430px,90vw);aspect-ratio:1;border:1px solid #3a5964;border-radius:50%;margin:18px auto;position:relative;background:radial-gradient(circle,#10242b 0 2%,transparent 2% 19%,#203a43 19.4% 20%,transparent 20.4% 39%,#203a43 39.4% 40%,transparent 40.4% 59%,#203a43 59.4% 60%,transparent 60.4% 79%,#203a43 79.4% 80%,transparent 80.4%);overflow:hidden}.radar:before{content:"";position:absolute;left:50%;top:0;height:100%;width:1px;background:#35525d}.radar:after{content:"";position:absolute;left:0;top:50%;height:1px;width:100%;background:#35525d}.blip{position:absolute;width:14px;height:14px;border:2px solid var(--ok);border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 0 14px #8ee6b255}
.keypad{max-width:320px;margin:14px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{font-size:18px}.readout{max-width:320px;margin:10px auto;text-align:center;font-size:27px;letter-spacing:4px;border:1px solid var(--line);padding:11px;background:#020405}
.final{display:flex;align-items:center;justify-content:center;text-align:center}.final h1{font-size:clamp(45px,13vw,100px);letter-spacing:8px}.final .terminal{text-align:left;display:inline-block;max-width:650px;width:100%}.fade{animation:fade .6s ease both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flash{animation:flash .35s}@keyframes flash{50%{filter:brightness(2)}}.locked{letter-spacing:2px;color:var(--mut)}
@media(max-width:650px){.screen{padding:15px;min-height:700px}.grid,.options{grid-template-columns:1fr}.answer{flex-direction:column}.answer button{width:100%}.top{font-size:9px}}
</style>
</head>
<body><div id="app"></div>
<script>
const S={level:-1,hints:0,tones:[],radar:false,physical:false,nav:false};

function header(status){return `<div class="top"><b>PROJECT BROCOLITO // 0D ENGINEERING CORE</b><span class="ok">${status}</span></div>`}
function page(content,status){document.getElementById("app").innerHTML=header(status)+content}
function boot(){
page(`<section class="screen fade"><div class="content" style="max-width:760px;margin:80px auto">
<div class="small">AIRBUS ENGINEERING SIMULATION ENVIRONMENT // LOCAL INSTANCE</div>
<div class="terminal" id="boot"></div><button class="primary" id="go" style="display:none">INITIALIZE CORE</button>
</div></section>`,"STANDBY");
const lines=["> loading thermodynamic solver...","✓ 0D geometry module","✓ engine parameter module","✓ navigation kernel","✓ signal processor","✓ target tracking","✓ event database","","> operator authentication...","OPERATOR: BROCOLITO","ACCESS LEVEL: ENGINEER","","> anomaly detected.","","> six data fragments missing.","","> RECOVERY PROTOCOL ARMED"];
let i=0,t=setInterval(()=>{bootbox.textContent+=lines[i]+"\\n";i++;if(i===lines.length){clearInterval(t);go.style.display="inline-block"}},85)
}
function verify(ok,msg){const f=document.getElementById("feedback");if(ok){f.innerHTML=`<span class="ok">✓ VERIFIED</span><br><span class="small">${msg}</span>`;setTimeout(()=>{S.level++;S.hints=0;render()},1250)}else{f.innerHTML=`<span class="bad">✕ INVALID INPUT</span><br><span class="small">Solver disagreement. Recheck the data.</span>`}}
const hints=[
"Área: A = πD²/4. Después ṁ = ρ·A·V. Redondea al entero.",
"Las frecuencias están en relación 1:2:4. Pulsa 220, después 440 y después 880. El instrumento tiene cuerdas.",
"Para x: 090° aporta +60 km y 270° aporta −60 km. El tramo a 180° no cambia x.",
"Solo un contacto cumple 315° + 35.000 ft + 440 kt.",
"31 de octubre. El mensaje sobre monstruos no es casual.",
"En irlandés: an = el/la, loch = lago, dubh = negro. La frase es AN LOCH DUBH.",
"El sobre físico debería contener una tarjeta/placa con el texto que aparece en pantalla. La clave está en la combinación de datos, no en un nuevo destino."
];
function hint(){S.hints++;document.getElementById("feedback").innerHTML=`<div class="hint">SYSTEM HINT #${S.hints}<br>${hints[S.level]}</div>`}
function common(title,desc,body,extra=""){return `<div class="progress"><div class="bar" style="width:${S.level/6*100}%"></div></div><section class="screen fade"><div class="content"><h2>${title}</h2><p class="mut">${desc}</p>${body}${extra}<div class="feedback" id="feedback"></div><button onclick="hint()">REQUEST HINT [${S.hints}]</button></div></section>`}
function render(){if(S.level<0)return boot();const a=[l1,l2,l3,l4,l5,l6];if(S.level>=6)return finale();page(a[S.level](),`ACTIVE // ${String(S.level+1).padStart(2,"0")}/06`)}
function l1(){return common("01 // 0D ENGINE CORE","El núcleo no converge. Resuelve el primer caso y extrae el parámetro de control.",`
<div class="terminal">STEADY-STATE INLET
D = 2.00 m
ρ = 1.20 kg/m³
V = 10.00 m/s

A = πD²/4
ṁ = ρ·A·V

REQUIRED:
mass flow, nearest whole number.

NOTE:
The solver will not accept a result
obtained by guessing.</div>
<div class="answer"><input id="a" inputmode="decimal" placeholder="kg/s"><button class="primary" onclick="verify(Math.round(Number(a.value))===38,'CONVERGENCE ACHIEVED. Fragment 01 recovered: ★')">VERIFY</button></div>`)}
function l2(){return common("02 // SIGNAL ANALYSIS","La señal está fragmentada. Reconstrúyela y después identifica el objeto.",`
<div class="terminal">SPECTRAL DATA
f₁ = 220 Hz
f₂ = 440 Hz
f₃ = 880 Hz

RATIO = 1 : 2 : 4
SEQUENCE = UNKNOWN</div>
<div class="options"><button onclick="tone(220)">220 Hz</button><button onclick="tone(440)">440 Hz</button><button onclick="tone(880)">880 Hz</button></div>
<div class="readout" id="tones">—</div>
<div class="answer"><input id="a" placeholder="instrument identity"><button class="primary" onclick="verify(a.value.toUpperCase().trim()==='ARPA' && S.tones.join(',')==='220,440,880','SIGNAL MATCH 100%. Fragment 02 recovered: HARP')">VERIFY</button></div>`)}
function tone(n){S.tones.push(n);if(S.tones.length>3)S.tones.shift();document.getElementById("tones").textContent=S.tones.join(" → ");if(S.tones.join(",")==="220,440,880"){document.getElementById("tones").innerHTML=`220 → 440 → 880<br><span class="ok">SEQUENCE MATCH ✓</span>`}}
function l3(){return common("03 // INERTIAL NAVIGATION","El algoritmo de navegación ha perdido su posición final. Recupera únicamente la componente x.",`
<div class="terminal">INITIAL
x = 0.00 km

SEGMENT A
track 090° | 120 km/h | 0.50 h

SEGMENT B
track 180° | 120 km/h | 0.25 h

SEGMENT C
track 270° | 120 km/h | 0.50 h

Δx = v·t·cos(track)

FINAL x = ? km
ROUND TO NEAREST WHOLE NUMBER</div>
<div class="answer"><input id="a" inputmode="numeric" placeholder="x-coordinate"><button class="primary" onclick="verify(Math.round(Number(a.value))===0,'TRACK ACQUIRED. Fragment 03 recovered: 1847')">VERIFY</button></div>`)}
function l4(){return common("04 // RADAR TARGET LOCK","Selecciona el único contacto que cumple simultáneamente los tres parámetros.",`
<div class="radar">
<div class="blip" style="left:30%;top:27%" onclick="rad(1)"></div><div class="blip" style="left:68%;top:30%" onclick="rad(2)"></div>
<div class="blip" style="left:74%;top:67%" onclick="rad(3)"></div><div class="blip" style="left:39%;top:72%" onclick="rad(4)"></div>
<div class="blip" style="left:53%;top:43%" onclick="rad(5)"></div></div>
<table><tr><th>Target</th><th>Heading</th><th>Altitude</th><th>Speed</th></tr>
<tr><td>01</td><td>045°</td><td>31,000 ft</td><td>410 kt</td></tr><tr><td>02</td><td>270°</td><td>35,000 ft</td><td>440 kt</td></tr>
<tr><td>03</td><td>090°</td><td>29,000 ft</td><td>390 kt</td></tr><tr><td>04</td><td>180°</td><td>41,000 ft</td><td>470 kt</td></tr>
<tr><td>05</td><td>315°</td><td>35,000 ft</td><td>440 kt</td></tr></table>
<p class="mut">LOCK CRITERIA: 315° / 35,000 ft / 440 kt.</p>
<div class="answer"><input id="a" inputmode="numeric" placeholder="target"><button class="primary" onclick="verify(Number(a.value)===5,'TARGET LOCKED. Fragment 04 recovered: C.F.')">VERIFY</button></div>`)}
function rad(n){if(n===5){a.value=5;document.getElementById("feedback").innerHTML='<span class="ok">✓ TARGET 05 LOCKED</span>'}else document.getElementById("feedback").innerHTML='<span class="bad">TARGET REJECTED</span>'}
function l5(){return common("05 // FAILURE MODE","La alarma no corresponde a una avería convencional. Diagnostica el evento temporal.",`
<div class="terminal bad">⚠ MASTER WARNING

EVENT MARKER
DAY   = 31
MONTH = 10

SYSTEM NOTE:
"Tonight, monsters are statistically
more likely than usual."

IDENTIFY EVENT TO STABILIZE SYSTEM.</div>
<div class="options"><button onclick="a.value='HALLOWEEN'">HALLOWEEN</button><button onclick="a.value='NEW YEAR'">NEW YEAR</button><button onclick="a.value='VALENTINE'">VALENTINE</button></div>
<div class="answer"><input id="a" placeholder="event"><button class="primary" onclick="verify(a.value.toUpperCase().trim()==='HALLOWEEN','FAULT ISOLATED. Fragment 05 recovered: 31/10')">VERIFY</button></div>`)}
function l6(){return common("06 // FINAL DATA RECOVERY","El último fragmento está cifrado en lenguaje. Hasta aquí, el sistema no ha revelado ninguna localización.",`
<div class="terminal">RECOVERED FRAGMENTS

★     HARP     STOKER     C.F.     31/10

HISTORICAL DATABASE
SUBJECT: BRAM STOKER
BIRTHPLACE: [CORRUPTED]

FINAL CLUE:
BLACK LAGOON

TASK:
Translate the phrase into Irish Gaelic.

FORMAT:
AN + LOCH + DUBH</div>
<p class="mut">Esta es la única prueba en la que una búsqueda externa puede resultar útil.</p>
<div class="answer"><input id="a" placeholder="Irish Gaelic phrase"><button class="primary" onclick="verify(/AN\\s*LOCH\\s*DUBH/i.test(a.value),'LANGUAGE IDENTIFIED. FINAL CORRELATION READY.')">DECRYPT</button></div>`)}
function finale(){
page(`<section class="screen final fade"><div class="content">
<div class="small">ALL SYSTEMS RESTORED // CORRELATION 100%</div>
<div style="margin:22px 0">${["★","HARP","STOKER","C.F.","31/10","AN LOCH DUBH"].map(x=>`<span class="card" style="display:inline-block;margin:3px;padding:8px">${x}</span>`).join("")}</div>
<div class="terminal">LANGUAGE ........ IRISH ✓
HISTORICAL ...... VERIFIED ✓
SIGNAL .......... VERIFIED ✓
TARGET .......... VERIFIED ✓
TEMPORAL ........ VERIFIED ✓

RECONSTRUCTING CLASSIFIED OUTPUT...
████████████████████ 100%

DESTINATION: DECRYPTED</div>
<h1>☘ DUBLÍN ☘</h1>
<p style="font-size:21px">MADRID → DUBLÍN</p><p style="font-size:25px">04.12.2026 → 07.12.2026</p>
<div class="card" style="max-width:600px;margin:20px auto"><b>SIMULATION OUTPUT</b><br><br>1 engineer<br>1 birthday<br>2 boarding passes<br>4 days<br>∞ memories<br><br><span class="ok"><b>RESULT: DUBLÍN</b></span></div>
<p style="font-size:20px">Haz la maleta, Brocolito. ❤️</p>
</div></section>`,"COMPLETE")
}
boot();
</script></body></html>
